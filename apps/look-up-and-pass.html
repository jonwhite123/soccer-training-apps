<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Receive under pressure, take a touch in the called direction, then pass to the called cone.">
<meta name="theme-color" content="#0e7a45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Look Up and Pass</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<style>
/* SHARED:base.css BEGIN — generated from shared/base.css; edit that file, then run node scripts/sync-shared.mjs */
/* Shared look for every app: tokens, layout, buttons, form controls, live-session screen.
   App-specific styles go in a second <style> block after this one. */
:root {
  color-scheme: light dark;
  --bg: #f3f6f2;
  --surface: #ffffff;
  --surface-2: #e7eee9;
  --text: #0f1d15;
  --muted: #536259;
  --line: #d1dbd4;
  --accent: #0e7a45;
  --accent-ink: #ffffff;
  --danger: #b3261e;
  --danger-ink: #ffffff;
  --radius: 14px;
  --gutter: 16px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b110e;
    --surface: #151e19;
    --surface-2: #1e2a23;
    --text: #ecf3ee;
    --muted: #98a79e;
    --line: #2b3731;
    --accent: #3cc77f;
    --accent-ink: #03140a;
    --danger: #ff7a6e;
    --danger-ink: #1c0504;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-size: 16px; /* never smaller on inputs, or iOS zooms on focus */
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
[hidden] { display: none !important; }

.wrap { width: 100%; max-width: 640px; margin: 0 auto; padding: var(--gutter); }
h1 { font-size: 1.6rem; line-height: 1.2; margin: 8px 0 12px; }
h2 { font-size: 1.1rem; line-height: 1.3; margin: 0 0 12px; }
p { margin: 0 0 12px; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: var(--gutter);
  margin-bottom: var(--gutter);
}
.stack > * { margin-top: 0; margin-bottom: 0; }
.stack > * + * { margin-top: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.row > * { flex: 1 1 0; min-width: 0; }

button, .button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 52px;
  padding: 0 12px;
  font: inherit;
  font-weight: 700;
  text-decoration: none;
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}
button:active, .button:active { transform: scale(0.98); }
button:disabled { opacity: 0.5; cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.danger { background: var(--danger); color: var(--danger-ink); border-color: transparent; }
.big { width: 100%; min-height: 80px; font-size: 1.5rem; }

label { display: block; font-weight: 600; margin-bottom: 6px; }
input, select {
  width: 100%;
  min-height: 48px;
  padding: 0 12px;
  font: inherit;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
}
input[type="range"] { min-height: 36px; padding: 0; border: 0; background: none; accent-color: var(--accent); }
input[type="checkbox"], input[type="radio"] { width: 22px; min-height: 22px; accent-color: var(--accent); }

/* Live-session screen: full height, one huge cue in the middle, Stop at the bottom. */
.session {
  display: flex;
  flex-direction: column;
  gap: var(--gutter);
  min-height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  min-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  padding: var(--gutter);
}
.cue-area { flex: 1; display: grid; place-items: center; }
.cue {
  font-size: clamp(3.5rem, 22vw, 10rem);
  font-weight: 800;
  line-height: 1;
  text-align: center;
  overflow-wrap: anywhere;
}
/* SHARED:base.css END */

<style>
.session { max-width: 720px; margin: 0 auto; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.top h1 { margin: 0; }

.panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: var(--gutter);
  text-align: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  transition: background-color 0.15s;
}
.arrow { font-size: clamp(4rem, 30vw, 11rem); font-weight: 800; line-height: 1; }
.word, .target { font-size: clamp(2.5rem, 14vw, 6rem); font-weight: 800; line-height: 1.05; }
.arrow:empty, .word:empty, .target:empty { display: none; }
.status { margin: 8px 0 0; color: var(--muted); max-width: 32ch; }
.panel[data-state="wait"] .word { color: var(--muted); }

/* Cone colours: the whole panel turns the colour of the target cone (--cone is set from COLORS). */
.panel[data-color] { background: var(--cone); color: var(--cone-ink); border-color: transparent; }
.panel[data-color] .status { color: inherit; opacity: 0.75; }

.settings { margin: 0; }
.settings summary { font-weight: 700; cursor: pointer; padding: 4px 0; }
.settings[open] summary { margin-bottom: 12px; }
.settings h2 { font-size: 1rem; margin-bottom: 0; }
.settings h2:not(:first-child) { margin-top: 24px; }

.setting { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 52px; padding: 0; font-size: 1.5rem; }
.stepper output { min-width: 3.5ch; text-align: center; font-size: 1.25rem; font-weight: 800; font-variant-numeric: tabular-nums; }

.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.chip { justify-content: flex-start; }
.chip .swatch {
  display: grid;
  place-items: center;
  flex: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--cone);
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.2);
}
.chip[aria-pressed="true"] { background: var(--cone); color: var(--cone-ink); border-color: transparent; }
.chip[aria-pressed="true"] .swatch { background: none; box-shadow: none; }
.chip[aria-pressed="true"] .swatch::before { content: "✓"; font-weight: 800; }
</style>
</head>
<body>

<main class="session">
  <header class="top">
    <h1>Look Up and Pass</h1>
    <span id="reps" class="muted"></span>
  </header>

  <div id="panel" class="panel" aria-live="assertive">
    <div id="arrow" class="arrow" aria-hidden="true"></div>
    <div id="word" class="word"></div>
    <div id="target" class="target"></div>
    <p id="status" class="status"></p>
  </div>

  <p id="lockNote" class="muted" hidden>This browser can't keep the screen on. Set Auto-Lock to Never, or the calls stop when the screen locks.</p>
  <button id="go" class="primary big">Go</button>

  <details class="card settings">
    <summary>Settings</summary>
    <div class="stack">
      <h2>Timing</h2>
      <div class="setting">
        <span id="directionAfterLabel">Direction call after Go</span>
        <div class="stepper" role="group" aria-labelledby="directionAfterLabel" data-key="directionAfter">
          <button type="button" aria-label="One second less">−</button>
          <output></output>
          <button type="button" aria-label="One second more">+</button>
        </div>
      </div>
      <div class="setting">
        <span id="targetAfterLabel">Cone call after direction</span>
        <div class="stepper" role="group" aria-labelledby="targetAfterLabel" data-key="targetAfter">
          <button type="button" aria-label="One second less">−</button>
          <output></output>
          <button type="button" aria-label="One second more">+</button>
        </div>
      </div>

      <h2>Stations</h2>
      <p class="muted">Pick 2 to 4 cone colours, one cone for each.</p>
      <div id="colors" class="chips" role="group" aria-label="Station colours"></div>
    </div>
  </details>
</main>

<script>
/* SHARED:kit.js BEGIN — generated from shared/kit.js; edit that file, then run node scripts/sync-shared.mjs */
/* Soccer Training Kit: small helpers shared by every app, exposed as window.Kit.
   Audio cues (beep, speak), screen wake lock, abortable timing, randomness and
   localStorage preferences. Built for iPhone Safari first; no network, works from file://. */
(function () {
  'use strict';

  // ---- Preferences (localStorage, namespaced, never throws) -----------------
  const PREFIX = 'stk:';
  const store = {
    get(key, fallback) {
      try {
        const raw = localStorage.getItem(PREFIX + key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch (e) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(PREFIX + key, JSON.stringify(value)); } catch (e) { /* private mode, file:// quirks */ }
    },
  };

  // ---- Audio ----------------------------------------------------------------
  let ctx = null;
  let speechPrimed = false;

  function audio() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    // iOS suspends or "interrupts" the context after calls and app switches.
    if (ctx.state !== 'running') ctx.resume().catch(() => {});
    return ctx;
  }

  // Call inside a tap/click handler before the first cue: iOS won't start audio
  // or speech any other way. Safe to call repeatedly.
  function unlock() {
    // iOS 17+: behave like a media app so the ring/silent switch doesn't mute cues.
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    const c = audio();
    const src = c.createBufferSource(); // a silent sample wakes the output route
    src.buffer = c.createBuffer(1, 1, 22050);
    src.connect(c.destination);
    src.start(0);
    if (!speechPrimed && 'speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      speechSynthesis.speak(u);
      speechPrimed = true;
    }
  }

  // A short tone. Square waves carry best through phone speakers outdoors.
  // `delay` (ms) schedules on the audio clock, so patterns stay tight.
  function beep({ freq = 1000, ms = 150, volume = 0.5, type = 'square', delay = 0 } = {}) {
    const c = audio();
    const start = c.currentTime + delay / 1000;
    const end = start + ms / 1000;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, start); // soft edges avoid clicks
    gain.gain.linearRampToValueAtTime(volume, start + 0.008);
    gain.gain.setValueAtTime(volume, Math.max(start + 0.008, end - 0.02));
    gain.gain.linearRampToValueAtTime(0, end);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(start);
    osc.stop(end + 0.05);
  }

  // n beeps in a row, e.g. beeps(3) for "go, go, go".
  function beeps(n, { gap = 100, ms = 150, delay = 0, ...opts } = {}) {
    for (let i = 0; i < n; i++) beep({ ...opts, ms, delay: delay + i * (ms + gap) });
  }

  // ---- Speech ---------------------------------------------------------------
  // Voice and speed are chosen in Sound check and shared by every app on the same origin.
  const speech = { voice: store.get('voice', null), rate: store.get('rate', 1.1) };

  function voices() {
    return 'speechSynthesis' in window ? speechSynthesis.getVoices() : [];
  }

  function setVoice(name) { speech.voice = name || null; store.set('voice', speech.voice); }
  function setRate(rate) { speech.rate = rate; store.set('rate', rate); }

  // Speak a cue, cutting off anything still being said. Resolves when done, or
  // after a timeout because iOS sometimes never fires `end`.
  function speak(text, { rate = speech.rate, pitch = 1, volume = 1, interrupt = true } = {}) {
    if (!('speechSynthesis' in window)) return Promise.resolve();
    if (interrupt && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = rate;
    u.pitch = pitch;
    u.volume = volume;
    const v = speech.voice && voices().find((x) => x.name === speech.voice);
    if (v) { u.voice = v; u.lang = v.lang; }
    return new Promise((resolve) => {
      const timer = setTimeout(resolve, 1500 + text.length * 150);
      u.onend = u.onerror = () => { clearTimeout(timer); resolve(); };
      speechSynthesis.speak(u);
    });
  }

  function hush() {
    if ('speechSynthesis' in window) speechSynthesis.cancel();
  }

  // ---- Screen wake lock -----------------------------------------------------
  let lock = null;
  let wantAwake = false;

  // Keep the screen on during a live session: page JS stops when the phone locks.
  // Resolves false when unavailable, so the app can tell the user to raise Auto-Lock.
  async function keepAwake(on = true) {
    wantAwake = on;
    if (!on) {
      if (lock) { lock.release().catch(() => {}); lock = null; }
      return false;
    }
    if (!('wakeLock' in navigator)) return false;
    if (lock && !lock.released) return true;
    try {
      lock = await navigator.wakeLock.request('screen');
      return true;
    } catch (e) { return false; }
  }

  // The browser drops the lock, and may suspend audio, whenever the page is hidden.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (wantAwake) keepAwake(true);
    if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {});
  });

  // ---- Timing ---------------------------------------------------------------
  const isAbort = (e) => !!e && e.name === 'AbortError';

  // Wait `ms`; rejects with AbortError as soon as `signal` aborts.
  function sleep(ms, signal) {
    return new Promise((resolve, reject) => {
      let timer;
      const abort = () => { clearTimeout(timer); reject(new DOMException('Stopped', 'AbortError')); };
      if (signal && signal.aborted) return abort();
      timer = setTimeout(() => {
        if (signal) signal.removeEventListener('abort', abort);
        resolve();
      }, ms);
      if (signal) signal.addEventListener('abort', abort, { once: true });
    });
  }

  // Run an async drill(signal) until it returns or stop() is called.
  // `done` always resolves, so the UI can return to setup after either.
  function run(drill) {
    const ctrl = new AbortController();
    const done = drill(ctrl.signal).catch((e) => { if (!isAbort(e)) console.error(e); });
    return { stop() { ctrl.abort(); hush(); }, done };
  }

  // ---- Randomness -----------------------------------------------------------
  const rand = (min, max) => min + Math.random() * (max - min);
  const randInt = (min, max) => Math.floor(rand(min, max + 1));
  const pick = (list) => list[Math.floor(Math.random() * list.length)];

  function shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---- Environment ----------------------------------------------------------
  function support() {
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    return {
      ios,
      webAudio: !!(window.AudioContext || window.webkitAudioContext),
      speech: 'speechSynthesis' in window,
      wakeLock: 'wakeLock' in navigator,
      silentSwitchOverride: 'audioSession' in navigator,
      standalone: matchMedia('(display-mode: standalone)').matches || navigator.standalone === true,
      fromFile: location.protocol === 'file:',
    };
  }

  window.Kit = {
    unlock, beep, beeps,
    speak, hush, voices, setVoice, setRate, speech,
    keepAwake,
    sleep, run, isAbort,
    rand, randInt, pick, shuffle,
    store, support,
  };
})();
/* SHARED:kit.js END */
</script>
<script>
// ---- Look Up and Pass ---------------------------------------------------------
// Go → wait → call a direction (the first touch, as if under pressure) → wait →
// call a cone colour (the pass target) → stop until Go is tapped again.
const $ = (sel) => document.querySelector(sel);
const STORE_KEY = 'look-up-and-pass';
const DIRECTIONS = [
  { word: 'Left', arrow: '←' },
  { word: 'Right', arrow: '→' },
  { word: 'Back', arrow: '↓' },
  { word: 'Forward', arrow: '↑' },
];
// Cone colours a station can use; `ink` is the text colour on top of that cone colour.
const COLORS = {
  red: { name: 'Red', bg: '#e0352b', ink: '#ffffff' },
  orange: { name: 'Orange', bg: '#ff8a1f', ink: '#1f1300' },
  yellow: { name: 'Yellow', bg: '#ffd60a', ink: '#1f1a00' },
  green: { name: 'Green', bg: '#1f9443', ink: '#ffffff' },
  blue: { name: 'Blue', bg: '#1d63d6', ink: '#ffffff' },
};
const STATIONS = { min: 2, max: 4 };
const TIMINGS = { directionAfter: { min: 1, max: 30 }, targetAfter: { min: 1, max: 15 } };
const DEFAULTS = { directionAfter: 7, targetAfter: 3, colors: ['orange', 'yellow'] };

const prefs = loadPrefs();
const panel = $('#panel');
const go = $('#go');
const chips = $('#colors');
let rep = null; // the rep in progress, from Kit.run
let startedAt = 0;
let reps = 0;

// Timing steppers: each tap moves one second.
for (const stepper of document.querySelectorAll('.stepper')) {
  const key = stepper.dataset.key;
  const { min, max } = TIMINGS[key];
  const [less, more] = stepper.querySelectorAll('button');
  const show = () => {
    stepper.querySelector('output').textContent = `${prefs[key]}s`;
    less.disabled = prefs[key] <= min;
    more.disabled = prefs[key] >= max;
  };
  const change = (by) => {
    prefs[key] = Math.min(max, Math.max(min, prefs[key] + by));
    savePrefs();
    show();
  };
  less.addEventListener('click', () => change(-1));
  more.addEventListener('click', () => change(1));
  show();
}

// Station colour chips: tap to add or remove a colour.
for (const [id, color] of Object.entries(COLORS)) {
  const chip = document.createElement('button');
  chip.type = 'button';
  chip.className = 'chip';
  chip.dataset.color = id;
  chip.style.setProperty('--cone', color.bg);
  chip.style.setProperty('--cone-ink', color.ink);
  chip.innerHTML = '<span class="swatch" aria-hidden="true"></span>';
  chip.append(color.name);
  chip.addEventListener('click', () => toggleColor(id));
  chips.append(chip);
}

render({ state: 'idle', status: idleText() });
showColors();

function loadPrefs() {
  const p = { ...DEFAULTS, ...Kit.store.get(STORE_KEY, {}) };
  for (const [key, { min, max }] of Object.entries(TIMINGS)) {
    p[key] = Number.isInteger(p[key]) ? Math.min(max, Math.max(min, p[key])) : DEFAULTS[key];
  }
  const colors = Array.isArray(p.colors) ? Object.keys(COLORS).filter((id) => p.colors.includes(id)) : [];
  p.colors = colors.length >= STATIONS.min && colors.length <= STATIONS.max ? colors : DEFAULTS.colors;
  return p;
}

function savePrefs() { Kit.store.set(STORE_KEY, prefs); }

function toggleColor(id) {
  const on = prefs.colors.includes(id);
  if (on ? prefs.colors.length <= STATIONS.min : prefs.colors.length >= STATIONS.max) return;
  // Keep the palette order so the list always reads the same way.
  prefs.colors = Object.keys(COLORS).filter((c) => (c === id ? !on : prefs.colors.includes(c)));
  savePrefs();
  showColors();
}

function showColors() {
  for (const chip of chips.children) {
    const on = prefs.colors.includes(chip.dataset.color);
    chip.setAttribute('aria-pressed', String(on));
    chip.disabled = !on && prefs.colors.length >= STATIONS.max;
  }
  if (panel.dataset.state === 'idle') render({ state: 'idle', status: idleText() });
}

// "Set out an orange and a yellow cone." / "Set out a red, an orange and a blue cone."
function idleText() {
  const names = prefs.colors.map((id) => `${id === 'orange' ? 'an' : 'a'} ${id}`);
  const list = `${names.slice(0, -1).join(', ')} and ${names[names.length - 1]}`;
  return `Set out ${list} cone. Tap Go, find your spot and play the ball against the wall.`;
}

go.addEventListener('click', () => {
  if (rep) {
    // Ignore the second half of an accidental double-tap on Go.
    if (performance.now() - startedAt > 600) rep.stop();
    return;
  }
  Kit.unlock(); // must run inside the tap on iOS
  // The screen stays on from the first Go until the page is closed, so it doesn't lock between reps.
  Kit.keepAwake().then((ok) => { $('#lockNote').hidden = ok; });
  startedAt = performance.now();
  setRunning(true);
  rep = Kit.run(playRep);
  rep.done.then(endRep);
});

async function playRep(signal) {
  Kit.beep({ freq: 660, ms: 80, volume: 0.3 }); // quiet tick: Go registered
  for (let s = prefs.directionAfter; s > 0; s--) {
    render({ state: 'wait', word: String(s), status: 'Play the ball against the wall.' });
    await Kit.sleep(1000, signal);
  }

  const dir = Kit.pick(DIRECTIONS);
  render({ state: 'direction', arrow: dir.arrow, word: dir.word, status: 'Take your touch…' });
  Kit.beep({ freq: 1200, ms: 100 }); // beep first: speech can lag a beat
  Kit.speak(dir.word);
  await Kit.sleep(prefs.targetAfter * 1000, signal);

  const target = COLORS[Kit.pick(prefs.colors)];
  render({ state: 'done', arrow: dir.arrow, word: dir.word, target, status: 'Tap Go for the next rep.' });
  Kit.beep({ freq: 1500, ms: 100 });
  Kit.speak(target.name);
  reps += 1;
  $('#reps').textContent = `${reps} rep${reps === 1 ? '' : 's'}`;
}

function endRep() {
  rep = null;
  setRunning(false);
  if (panel.dataset.state !== 'done') render({ state: 'idle', status: 'Stopped. Tap Go to start again.' });
}

function setRunning(running) {
  go.textContent = running ? 'Stop' : 'Go';
  go.classList.toggle('primary', !running);
  go.classList.toggle('danger', running);
}

// `target` is an entry from COLORS, or null before the cone is called.
function render({ state, arrow = '', word = '', target = null, status = '' }) {
  panel.dataset.state = state;
  if (target) {
    panel.dataset.color = target.name.toLowerCase();
    panel.style.setProperty('--cone', target.bg);
    panel.style.setProperty('--cone-ink', target.ink);
  } else {
    delete panel.dataset.color;
  }
  $('#arrow').textContent = arrow;
  $('#word').textContent = word;
  $('#target').textContent = target ? target.name : '';
  $('#status').textContent = status;
}
</script>
</body>
</html>
