<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="TODO: one sentence on what this app trains.">
<meta name="theme-color" content="#0e7a45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>App Name</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<style>
/* SHARED:base.css BEGIN — generated from shared/base.css; edit that file, then run node scripts/sync-shared.mjs */
/* Shared look for every app: tokens, layout, buttons, form controls, live-session screen.
   App-specific styles go in a second <style> block after this one. */
:root {
  color-scheme: light dark;
  --bg: #f3f6f2;
  --surface: #ffffff;
  --surface-2: #e7eee9;
  --text: #0f1d15;
  --muted: #536259;
  --line: #d1dbd4;
  --accent: #0e7a45;
  --accent-ink: #ffffff;
  --danger: #b3261e;
  --danger-ink: #ffffff;
  --radius: 14px;
  --gutter: 16px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b110e;
    --surface: #151e19;
    --surface-2: #1e2a23;
    --text: #ecf3ee;
    --muted: #98a79e;
    --line: #2b3731;
    --accent: #3cc77f;
    --accent-ink: #03140a;
    --danger: #ff7a6e;
    --danger-ink: #1c0504;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-size: 16px; /* never smaller on inputs, or iOS zooms on focus */
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
[hidden] { display: none !important; }

.wrap { width: 100%; max-width: 640px; margin: 0 auto; padding: var(--gutter); }
h1 { font-size: 1.6rem; line-height: 1.2; margin: 8px 0 12px; }
h2 { font-size: 1.1rem; line-height: 1.3; margin: 0 0 12px; }
p { margin: 0 0 12px; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: var(--gutter);
  margin-bottom: var(--gutter);
}
.stack > * { margin-top: 0; margin-bottom: 0; }
.stack > * + * { margin-top: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.row > * { flex: 1 1 0; min-width: 0; }

button, .button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 52px;
  padding: 0 12px;
  font: inherit;
  font-weight: 700;
  text-decoration: none;
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}
button:active, .button:active { transform: scale(0.98); }
button:disabled { opacity: 0.5; cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.danger { background: var(--danger); color: var(--danger-ink); border-color: transparent; }
.big { width: 100%; min-height: 80px; font-size: 1.5rem; }

label { display: block; font-weight: 600; margin-bottom: 6px; }
input, select {
  width: 100%;
  min-height: 48px;
  padding: 0 12px;
  font: inherit;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
}
input[type="range"] { min-height: 36px; padding: 0; border: 0; background: none; accent-color: var(--accent); }
input[type="checkbox"], input[type="radio"] { width: 22px; min-height: 22px; accent-color: var(--accent); }

/* Live-session screen: full height, one huge cue in the middle, Stop at the bottom. */
.session {
  display: flex;
  flex-direction: column;
  gap: var(--gutter);
  min-height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  min-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  padding: var(--gutter);
}
.cue-area { flex: 1; display: grid; place-items: center; }
.cue {
  font-size: clamp(3.5rem, 22vw, 10rem);
  font-weight: 800;
  line-height: 1;
  text-align: center;
  overflow-wrap: anywhere;
}
/* SHARED:base.css END */
</style>
<style>
/* App styles */
</style>
</head>
<body>

<!-- Setup screen: instructions, settings, Start. -->
<main id="setup" class="wrap">
  <h1>App Name</h1>
  <p class="muted">TODO: one or two lines telling the player what to do.</p>

  <div class="card stack">
    <div>
      <label for="gap">Time between cues: <span id="gapOut"></span></label>
      <input id="gap" type="range" min="2" max="10" step="1">
    </div>
  </div>

  <button id="start" class="primary big">Start</button>
</main>

<!-- Live-session screen: one big cue, Stop always on screen. Classroom apps can delete this. -->
<section id="session" class="session" hidden>
  <div class="cue-area"><div id="cue" class="cue" aria-live="assertive"></div></div>
  <p id="lockNote" class="muted" hidden>This browser can't keep the screen on. Set Auto-Lock to Never, or the cues stop when the screen locks.</p>
  <button id="stop" class="danger big">Stop</button>
</section>

<script>
/* SHARED:kit.js BEGIN — generated from shared/kit.js; edit that file, then run node scripts/sync-shared.mjs */
/* Soccer Training Kit: small helpers shared by every app, exposed as window.Kit.
   Audio cues (beep, speak), screen wake lock, abortable timing, randomness and
   localStorage preferences. Built for iPhone Safari first; no network, works from file://. */
(function () {
  'use strict';

  // ---- Preferences (localStorage, namespaced, never throws) -----------------
  const PREFIX = 'stk:';
  const store = {
    get(key, fallback) {
      try {
        const raw = localStorage.getItem(PREFIX + key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch (e) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(PREFIX + key, JSON.stringify(value)); } catch (e) { /* private mode, file:// quirks */ }
    },
  };

  // ---- Audio ----------------------------------------------------------------
  let ctx = null;
  let speechPrimed = false;

  function audio() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    // iOS suspends or "interrupts" the context after calls and app switches.
    if (ctx.state !== 'running') ctx.resume().catch(() => {});
    return ctx;
  }

  // Call inside a tap/click handler before the first cue: iOS won't start audio
  // or speech any other way. Safe to call repeatedly.
  function unlock() {
    // iOS 17+: behave like a media app so the ring/silent switch doesn't mute cues.
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    const c = audio();
    const src = c.createBufferSource(); // a silent sample wakes the output route
    src.buffer = c.createBuffer(1, 1, 22050);
    src.connect(c.destination);
    src.start(0);
    if (!speechPrimed && 'speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      speechSynthesis.speak(u);
      speechPrimed = true;
    }
  }

  // A short tone. Square waves carry best through phone speakers outdoors.
  // `delay` (ms) schedules on the audio clock, so patterns stay tight.
  function beep({ freq = 1000, ms = 150, volume = 0.5, type = 'square', delay = 0 } = {}) {
    const c = audio();
    const start = c.currentTime + delay / 1000;
    const end = start + ms / 1000;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, start); // soft edges avoid clicks
    gain.gain.linearRampToValueAtTime(volume, start + 0.008);
    gain.gain.setValueAtTime(volume, Math.max(start + 0.008, end - 0.02));
    gain.gain.linearRampToValueAtTime(0, end);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(start);
    osc.stop(end + 0.05);
  }

  // n beeps in a row, e.g. beeps(3) for "go, go, go".
  function beeps(n, { gap = 100, ms = 150, delay = 0, ...opts } = {}) {
    for (let i = 0; i < n; i++) beep({ ...opts, ms, delay: delay + i * (ms + gap) });
  }

  // ---- Speech ---------------------------------------------------------------
  // Voice and speed are chosen in Sound check and shared by every app on the same origin.
  const speech = { voice: store.get('voice', null), rate: store.get('rate', 1.1) };

  function voices() {
    return 'speechSynthesis' in window ? speechSynthesis.getVoices() : [];
  }

  function setVoice(name) { speech.voice = name || null; store.set('voice', speech.voice); }
  function setRate(rate) { speech.rate = rate; store.set('rate', rate); }

  // Speak a cue, cutting off anything still being said. Resolves when done, or
  // after a timeout because iOS sometimes never fires `end`.
  function speak(text, { rate = speech.rate, pitch = 1, volume = 1, interrupt = true } = {}) {
    if (!('speechSynthesis' in window)) return Promise.resolve();
    if (interrupt && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = rate;
    u.pitch = pitch;
    u.volume = volume;
    const v = speech.voice && voices().find((x) => x.name === speech.voice);
    if (v) { u.voice = v; u.lang = v.lang; }
    return new Promise((resolve) => {
      const timer = setTimeout(resolve, 1500 + text.length * 150);
      u.onend = u.onerror = () => { clearTimeout(timer); resolve(); };
      speechSynthesis.speak(u);
    });
  }

  function hush() {
    if ('speechSynthesis' in window) speechSynthesis.cancel();
  }

  // ---- Screen wake lock -----------------------------------------------------
  let lock = null;
  let wantAwake = false;

  // Keep the screen on during a live session: page JS stops when the phone locks.
  // Resolves false when unavailable, so the app can tell the user to raise Auto-Lock.
  async function keepAwake(on = true) {
    wantAwake = on;
    if (!on) {
      if (lock) { lock.release().catch(() => {}); lock = null; }
      return false;
    }
    if (!('wakeLock' in navigator)) return false;
    if (lock && !lock.released) return true;
    try {
      lock = await navigator.wakeLock.request('screen');
      return true;
    } catch (e) { return false; }
  }

  // The browser drops the lock, and may suspend audio, whenever the page is hidden.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (wantAwake) keepAwake(true);
    if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {});
  });

  // ---- Timing ---------------------------------------------------------------
  const isAbort = (e) => !!e && e.name === 'AbortError';

  // Wait `ms`; rejects with AbortError as soon as `signal` aborts.
  function sleep(ms, signal) {
    return new Promise((resolve, reject) => {
      let timer;
      const abort = () => { clearTimeout(timer); reject(new DOMException('Stopped', 'AbortError')); };
      if (signal && signal.aborted) return abort();
      timer = setTimeout(() => {
        if (signal) signal.removeEventListener('abort', abort);
        resolve();
      }, ms);
      if (signal) signal.addEventListener('abort', abort, { once: true });
    });
  }

  // Run an async drill(signal) until it returns or stop() is called.
  // `done` always resolves, so the UI can return to setup after either.
  function run(drill) {
    const ctrl = new AbortController();
    const done = drill(ctrl.signal).catch((e) => { if (!isAbort(e)) console.error(e); });
    return { stop() { ctrl.abort(); hush(); }, done };
  }

  // ---- Randomness -----------------------------------------------------------
  const rand = (min, max) => min + Math.random() * (max - min);
  const randInt = (min, max) => Math.floor(rand(min, max + 1));
  const pick = (list) => list[Math.floor(Math.random() * list.length)];

  function shuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---- Environment ----------------------------------------------------------
  function support() {
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    return {
      ios,
      webAudio: !!(window.AudioContext || window.webkitAudioContext),
      speech: 'speechSynthesis' in window,
      wakeLock: 'wakeLock' in navigator,
      silentSwitchOverride: 'audioSession' in navigator,
      standalone: matchMedia('(display-mode: standalone)').matches || navigator.standalone === true,
      fromFile: location.protocol === 'file:',
    };
  }

  window.Kit = {
    unlock, beep, beeps,
    speak, hush, voices, setVoice, setRate, speech,
    keepAwake,
    sleep, run, isAbort,
    rand, randInt, pick, shuffle,
    store, support,
  };
})();
/* SHARED:kit.js END */
</script>
<script>
// ---- App --------------------------------------------------------------------
// Placeholder drill: calls a random cue every few seconds. Replace with the real app.
const $ = (sel) => document.querySelector(sel);
const STORE_KEY = 'app-template'; // rename per app
const CUES = ['Left', 'Right', 'Turn'];
const prefs = Kit.store.get(STORE_KEY, { gap: 4 });
let session = null;

const gap = $('#gap');
gap.value = prefs.gap;
const showGap = () => { $('#gapOut').textContent = `about ${gap.value}s`; };
showGap();
gap.addEventListener('input', () => {
  showGap();
  Kit.store.set(STORE_KEY, { ...prefs, gap: Number(gap.value) });
});

$('#start').addEventListener('click', () => {
  Kit.unlock(); // must run inside the tap on iOS
  Kit.keepAwake().then((ok) => { $('#lockNote').hidden = ok; });
  $('#setup').hidden = true;
  $('#session').hidden = false;
  session = Kit.run(drill);
  session.done.then(finish);
});

$('#stop').addEventListener('click', () => session.stop());

async function drill(signal) {
  const seconds = Number(gap.value);
  for (let n = 3; n > 0; n--) { // count-in
    show(n);
    Kit.beep({ freq: 660, ms: 120 });
    await Kit.sleep(1000, signal);
  }
  for (;;) {
    const cue = Kit.pick(CUES);
    show(cue);
    Kit.beep({ freq: 1200, ms: 90 }); // beep first: speech can lag a beat
    Kit.speak(cue);
    await Kit.sleep(Kit.rand(seconds * 0.7, seconds * 1.3) * 1000, signal);
  }
}

function show(text) { $('#cue').textContent = text; }

function finish() {
  Kit.keepAwake(false);
  $('#session').hidden = true;
  $('#setup').hidden = false;
  show('');
}
</script>
</body>
</html>
